services:
  - type: web
    name: amertak-bot
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SITE_URL
        value: https://amertakcloud.vercel.app
      - key: WEBHOOK_SECRET
        generateValue: true
